{% assign profile = site.data.academic %}
<ul class="profile-links" aria-label="Academic links" role="list">
  <li><a href="mailto:{{ profile.email }}" data-copy-email="{{ profile.email }}" title="{{ profile.email }}"><span class="link-label">Email</span></a></li>
  {% if profile.googlescholar %}<li><a href="{{ profile.googlescholar }}" target="_blank" rel="noopener noreferrer">Google Scholar</a></li>{% endif %}
  <li><a href="{{ profile.github }}" target="_blank" rel="noopener noreferrer">GitHub</a></li>
  {% if profile.bilibili %}<li><a href="{{ profile.bilibili }}" target="_blank" rel="noopener noreferrer">Bilibili</a></li>{% endif %}
  {% unless page.url == '/cv/' %}<li><a href="{{ profile.cv | relative_url }}">CV (PDF)</a></li>{% endunless %}
</ul>
