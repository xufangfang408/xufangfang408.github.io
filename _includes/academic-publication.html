{% assign pub = site.data.academic.publication %}
<article class="publication">
  <div class="publication-topline"><span class="eyebrow">{{ pub.venue }} · {{ pub.year }}</span><span class="status">Preprint</span></div>
  <h3><a href="{{ pub.preprint }}">{{ pub.title }}</a></h3>
  <p class="authors">{{ pub.authors }}</p>
  <p class="review-status">{{ pub.status }}.</p>
  <p>{{ pub.summary }}</p>
  <p>{{ pub.results }}</p>
  <p class="contribution"><strong>My contribution · First author</strong><br>{{ pub.contribution }}</p>
  <div class="publication-links"><a class="button button-small" href="{{ pub.preprint }}">Read preprint <span aria-hidden="true">↗</span></a><a class="text-link" href="{{ pub.code }}">Code on GitHub <span aria-hidden="true">↗</span></a></div>
</article>
