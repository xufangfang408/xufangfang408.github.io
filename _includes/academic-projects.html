<div class="entry-list projects">
{% for project in site.data.academic.projects %}
  <article class="project">
    <h3>{{ project.name | escape }}</h3>
    <p>{{ project.subtitle | escape }}</p>
    <p class="item-date">{{ project.period | escape }}</p>
    <p class="project-description">{{ project.description | escape }}</p>
  </article>
{% endfor %}
</div>
