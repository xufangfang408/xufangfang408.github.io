name: Update visitor statistics

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - .github/workflows/visitor-statistics.yml
      - scripts/sync-visitor-stats.cjs
      - scripts/visitor-region-centers.json

permissions:
  contents: write

concurrency: visitor-statistics

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read aggregate visit counts
        env:
          GOATCOUNTER_ORIGIN: https://xufangfang408.goatcounter.com
          GOATCOUNTER_API_TOKEN: ${{ secrets.GOATCOUNTER_API_TOKEN }}
        run: node scripts/sync-visitor-stats.cjs "$RUNNER_TEMP/visitor-stats.json"
      - name: Publish aggregate data to the visitor-stats branch
        run: |
          test -s "$RUNNER_TEMP/visitor-stats.json" || exit 0
          if git ls-remote --exit-code --heads origin refs/heads/visitor-stats > /dev/null; then
            git fetch --depth=1 origin refs/heads/visitor-stats
            git switch --detach FETCH_HEAD
          else
            git switch --orphan visitor-stats
          fi
          cp "$RUNNER_TEMP/visitor-stats.json" visitor-stats.json
          git add -- visitor-stats.json
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update visitor statistics'
          git push origin HEAD:refs/heads/visitor-stats
