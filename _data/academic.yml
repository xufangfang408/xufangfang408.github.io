    description: Identifying actionable targets and prioritizing interventions to drive biological systems toward desired states.

publication:
  title: "Spaceland: Histology-Guided Reconstruction of High-Resolution Whole-Organ 3D Molecular Atlases from Sparse Spatial Transcriptomics"
  authors: '<strong>Fangfang Xu*</strong>, Zhenfeng Zhuang*, Yun Zhu*, Bo Ying, Naiqiao Hou, Weiping Lin, Liansheng Wang, Chaoyong Yang, Jia Song'
  venue: bioRxiv
  year: 2026
  status: Manuscript under revision at Nature Communications
  period: Dec. 2024 – Present
  doi: 10.64898/2026.07.23.739686
  preprint: https://www.biorxiv.org/content/10.64898/2026.07.23.739686v1
  code: https://github.com/xufangfang408/Spaceland
  summary: A histology-conditioned continuous molecular field model that combines foundation-model H&E representations with inter-section deformation modeling to infer gene expression across sparsely measured tissue volumes.
  results: Reconstructed continuous 3D gene-expression fields on an 8-μm grid with molecular sampling gaps up to 400 μm, evaluated across mouse olfactory bulb, mouse hemibrain, and planarian regeneration datasets.
  contribution: Conceived the research project, designed the model, conducted the majority of benchmarking experiments, and wrote the manuscript.

projects:
  - name: Spaceland-omics
    subtitle: Histology-guided spatial multi-omics modeling
    period: Jun. 2026 – Present
    description: Extending Spaceland from transcriptomics to multimodal molecular prediction using serial histology as a shared spatial context. Investigating whether a common tissue representation can support continuous modeling of transcriptomic and proteomic states across sparsely measured sections.
  - name: OmicsBind
    subtitle: Histology-anchored multimodal representation learning
    period: Jul. 2026 – Present
    description: Developing an ImageBind-inspired framework to align spatial molecular modalities through a shared histology anchor. Each molecular modality is paired with H&E, rather than directly with every other modality, to learn from partially paired spatial-omics datasets.

